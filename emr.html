    let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || createInitialData();
    let currentTab = 'consultation';
    let isServerSynced = false;
    let lastServerUpdatedAt = null;

    function updateSyncIndicator(connected) {
      isServerSynced = connected;
      const dot = document.getElementById('sync-status-dot');
      const txt = document.getElementById('sync-status-text');
      if (!dot || !txt) return;
      if (connected) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        txt.textContent = 'Clinic Hub Synced';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400';
        txt.textContent = 'Browser Local Mode';
      }
    }

    function saveDB() {
      db.updatedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      if (isServerSynced) {
        const payload = {
          patients: db.patients,
          consultations: db.consultations,
          appointments: db.appointments,
          labs: db.labs,
          prescriptions: db.prescriptions,
          wards: db.wards
        };
        fetch('/api/state', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(res => { if (res && res.updatedAt) lastServerUpdatedAt = res.updatedAt; })
        .catch(() => updateSyncIndicator(false));
      }
    }

    async function syncFromServer(isInitial = false) {
      if (window.location.protocol === 'file:') {
        updateSyncIndicator(false);
        return;
      }
      try {
        const res = await fetch('/api/state', { cache: 'no-store' });
        if (!res.ok) throw new Error('Server unavailable');
        const serverData = await res.json();
        updateSyncIndicator(true);

        if (!isInitial && serverData.updatedAt && serverData.updatedAt === lastServerUpdatedAt) {
          return;
        }
        lastServerUpdatedAt = serverData.updatedAt || null;

        // Avoid interrupting typing in an input/textarea
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);

        db.patients = serverData.patients || db.patients;
        db.consultations = serverData.consultations || db.consultations;
        db.appointments = serverData.appointments || db.appointments;
        db.labs = serverData.labs || db.labs;
        db.prescriptions = serverData.prescriptions || db.prescriptions;
        db.wards = serverData.wards || db.wards;

        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        updateTopBadges();
        if (!isTyping && db.currentUser) {
          renderCurrentTab();
        }
      } catch (e) {
        updateSyncIndicator(false);
      }
    }

    function downloadBackup() {
      if (isServerSynced) {
        window.location.href = '/api/backup';
        showToast('Downloading Clinic Hub backup...');
        return;
      }
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `rssmc-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup file downloaded.');
    }

    function restoreBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.patients) || !parsed.wards) {
            return alert('Invalid backup file.');
          }
          if (!confirm('Restore all clinic records from this backup? Current data will be replaced.')) return;
          db.patients = parsed.patients;
          db.consultations = parsed.consultations || [];
          db.appointments = parsed.appointments || [];
          db.labs = parsed.labs || [];
          db.prescriptions = parsed.prescriptions || [];
          db.wards = parsed.wards;
          if (isServerSynced) {
            await fetch('/api/restore', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(parsed)
            });
          }
          saveDB();
          renderCurrentTab();
          showToast('Clinic records restored successfully!');
        } catch (err) {
          alert('Could not read backup JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    const CLOUD_CFG_KEY = 'rssmc_cloud_cfg_v1';

    function getLocalCloudCfg() {
      return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY) || '{"supabaseUrl":"","supabaseKey":"","clinicId":"rssmc-jos","autoSync":true,"lastSyncedAt":null,"lastStatus":"Not configured"}');
    }

    function updateCloudDot(status) {
      const dot = document.getElementById('cloud-dot');
      if (!dot) return;
      if (status === 'Synced') dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
      else if (status && status.includes('Offline')) dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
      else dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-300';
    }

    async function pushSnapshotFromBrowser(cfg) {
      if (!cfg.supabaseUrl || !cfg.supabaseKey || !navigator.onLine) return false;
      try {
        const base = cfg.supabaseUrl.replace(/\/+$/, '');
        const res = await fetch(`${base}/rest/v1/clinic_backups?on_conflict=clinic_id`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': cfg.supabaseKey,
            'Authorization': `Bearer ${cfg.supabaseKey}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({
            clinic_id: cfg.clinicId || 'rssmc-jos',
            updated_at: db.updatedAt || new Date().toISOString(),
            payload: db
          })
        });
        if (res.ok) {
          cfg.lastSyncedAt = new Date().toISOString();
          cfg.lastStatus = 'Synced';
          localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg));
          updateCloudDot('Synced');
          return true;
        }
      } catch (e) {}
      return false;
    }

    async function saveCloudConfig(e) {
      e.preventDefault();
      const cfg = {
        supabaseUrl: document.getElementById('cloud-url').value.trim(),
        supabaseKey: document.getElementById('cloud-key').value.trim(),
        clinicId: document.getElementById('cloud-clinic-id').value.trim() || 'rssmc-jos',
        autoSync: document.getElementById('cloud-autosync').checked
      };
      localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg));

      if (isServerSynced) {
        const res = await fetch('/api/cloud-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cfg)
        });
        const data = await res.json();
        updateCloudDot(data.config.lastStatus);
        showToast(data.syncResult && data.syncResult.ok ? 'Cloud backup synced to Supabase!' : `Saved (${data.config.lastStatus})`);
      } else {
        const ok = await pushSnapshotFromBrowser(cfg);
        showToast(ok ? 'Synced to Supabase from browser!' : 'Settings saved (will sync when online).');
      }
      openCloudSyncModal();
    }

    async function triggerCloudSyncNow() {
      const cfg = getLocalCloudCfg();
      if (isServerSynced) {
        const res = await fetch('/api/cloud-sync', { method: 'POST' });
        const data = await res.json();
        updateCloudDot(data.status);
        if (data.ok) {
          showToast('Synced to Supabase!');
          return openCloudSyncModal();
        }
      }
      // Fallback: if doctor's phone has mobile data on, push directly from browser
      const ok = await pushSnapshotFromBrowser(cfg);
      showToast(ok ? 'Synced to Supabase via device internet!' : 'Offline — queued until internet is available.');
      openCloudSyncModal();
    }

    // Automatic browser-side cloud sync when a doctor's phone has internet
    window.addEventListener('online', () => {
      const cfg = getLocalCloudCfg();
      if (cfg.autoSync && cfg.supabaseUrl && cfg.supabaseKey) {
        pushSnapshotFromBrowser(cfg);
      }
    });

    function esc(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function getPatient(id) {
      return db.patients.find(p => p.id === id);

    function updateTopBadges() {
      const waitingCount = db.patients.filter(p => p.status === 'Awaiting Consultation' || p.status === 'With Doctor').length;
      let occupiedCount = 0;
      Object.values(db.wards).forEach(w => {
        occupiedCount += w.beds.filter(b => b.patientId).length;
      });
      const pendingLabs = db.labs.filter(l => l.status === 'Pending').length;
      const pendingRx = db.prescriptions.filter(r => r.status === 'Pending').length;

      const elConsult = document.getElementById('badge-consultation-count');
      if (elConsult) elConsult.textContent = `${waitingCount} Waiting`;

      const elWards = document.getElementById('badge-wards-count');
      if (elWards) elWards.textContent = `${occupiedCount} Occupied`;

      const elDiag = document.getElementById('badge-diag-count');
      if (elDiag) elDiag.textContent = `${pendingLabs} Lab &bull; ${pendingRx} Rx`;
    }

    function renderCurrentTab() {
      updateTopBadges();
      const container = document.getElementById('tab-content');
      if (currentTab === 'consultation') container.innerHTML = viewConsultation();
      else if (currentTab === 'wards') container.innerHTML = viewWards();
      else if (currentTab === 'records') container.innerHTML = viewRecords();
      else if (currentTab === 'diagnostics') container.innerHTML = viewDiagnostics();

    function setDiagnosis(text) {
      const el = document.getElementById('input-diagnosis');
      if (el) el.value = text;
    }

    async function apiMutate(method, endpoint, body) {
      if (!isServerSynced) return;
      try {
        const res = await fetch(endpoint, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data && data.updatedAt) lastServerUpdatedAt = data.updatedAt;
      } catch (e) {}
    }

    function saveClinicalNoteOnly() {
      if (!canRole(['doctor'])) return alert('Access restricted: Only a Doctor/Admin can save clinical diagnoses.');
      const activePt = getPatient(db.activePatientId);
      if (!activePt) return;

      const dxInput = document.getElementById('input-diagnosis');
      const notesInput = document.getElementById('input-clinical-notes');

      const dx = dxInput ? dxInput.value.trim() : '';
      const notes = notesInput ? notesInput.value.trim() : '';

      if (!dx) return alert('Please enter or select a working diagnosis.');

      const consult = {
        id: 'CNS-' + String(db.consultations.length + 1).padStart(3, '0'),
        patientId: activePt.id,
        doctorName: db.currentUser.name,
        date: fullStamp(),
        diagnosis: dx,
        notes: notes
      };

      db.consultations.unshift(consult);
      activePt.status = 'Consulted';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('POST', '/api/consultations', consult);
      renderCurrentTab();
      showToast('Encounter saved successfully!');
    }

    function fastOrderLab(testName) {
      if (!canRole(['doctor', 'nurse'])) return alert('Access restricted: Only Doctors/Nurses can order labs.');
      const lab = {
        id: 'LAB-' + String(db.labs.length + 1).padStart(2, '0'),
        patientId: db.activePatientId,
        testName: testName,
        orderedBy: db.currentUser.name,
        status: 'Pending',
        result: '',
        orderedAt: fullStamp()
      };
      db.labs.unshift(lab);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('POST', '/api/labs', lab);
      renderCurrentTab();
      showToast(`Ordered: ${testName}`);
    }

    function fastOrderCustomLab() {
      const input = document.getElementById('input-custom-lab');
      const val = input ? input.value.trim() : '';
      if (!val) return alert('Enter lab test name.');
      fastOrderLab(val);

    function fastPrescribe(med, dose) {
      if (!canRole(['doctor'])) return alert('Access restricted: Only a Doctor can prescribe medications.');
      const rx = {
        id: 'RX-' + String(db.prescriptions.length + 1).padStart(2, '0'),
        patientId: db.activePatientId,
        medication: med,
        dosage: dose,
        prescribedBy: db.currentUser.name,
        status: 'Pending',
        prescribedAt: fullStamp()
      };
      db.prescriptions.unshift(rx);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('POST', '/api/prescriptions', rx);
      renderCurrentTab();
      showToast(`Prescribed: ${med}`);
    }

    function fastCustomPrescribe() {
      const medInput = document.getElementById('input-custom-med');
      const doseInput = document.getElementById('input-custom-dose');
      const med = medInput ? medInput.value.trim() : '';
      const dose = doseInput ? doseInput.value.trim() : '';
      if (!med || !dose) return alert('Please enter both medication name and dosage.');
      fastPrescribe(med, dose);
    }

    function quickAdmitToWard(wardKey) {
      if (!canRole(['doctor', 'nurse'])) return alert('Access restricted: Only Doctors or Nurses can admit patients.');
      const ward = db.wards[wardKey];
      const bedIdx = ward.beds.findIndex(b => !b.patientId);
      if (bedIdx === -1) return alert('No free bed in this ward.');
      const freeBed = ward.beds[bedIdx];

      const pt = getPatient(db.activePatientId);
      const stamp = fullStamp();
      freeBed.patientId = pt.id;
      freeBed.diagnosis = pt.complaint || 'Inpatient Admission';
      freeBed.admittedAt = stamp;
      pt.status = 'Admitted';

      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('PATCH', '/api/wards', { action: 'admit', wardKey, bedIdx, patientId: pt.id, diagnosis: freeBed.diagnosis, admittedAt: stamp });
      renderCurrentTab();
      showToast(`${pt.name} admitted to ${ward.label} (${freeBed.bedNo})`);
    }

    function saveLabResult(labId) {
      if (!canRole(['lab', 'doctor'])) return alert('Access restricted: Only Lab Scientists or Doctors can save lab results.');

      const val = input ? input.value.trim() : '';
      if (!val) return alert('Enter lab result.');
      const l = db.labs.find(x => x.id === labId);
      if (l) {
        l.result = val;
        l.status = 'Completed';
        l.verifiedBy = db.currentUser.name;
        l.completedAt = fullStamp();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        updateTopBadges();
        apiMutate('PATCH', '/api/labs', { id: labId, result: val, verifiedBy: db.currentUser.name, completedAt: l.completedAt });
        renderCurrentTab();
        showToast('Lab result saved.');
      }
    }

    function dispenseRx(rxId) {
      if (!canRole(['pharmacy'])) return alert('Access restricted: Only a Pharmacist can dispense medications.');
      const r = db.prescriptions.find(x => x.id === rxId);
      if (r) {
        r.status = 'Dispensed';
        r.dispensedBy = db.currentUser.name;
        r.dispensedAt = fullStamp();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        updateTopBadges();
        apiMutate('PATCH', '/api/prescriptions', { id: rxId, dispensedBy: db.currentUser.name, dispensedAt: r.dispensedAt });
        renderCurrentTab();
        showToast('Prescription dispensed.');
      }
    }

    function viewReception() {
      return `
        <div class="grid lg:grid-cols-3 gap-8">
          <!-- Register Walk-In -->
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 lg:col-span-1">
            <h3 class="font-bold text-slate-900 text-base mb-4">Patient Triage &amp; Intake</h3>
            <form onsubmit="handleRegister(event)" class="space-y-3 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Full Name *</label>
                <input required id="intake-name" type="text" placeholder="e.g. Grace Pam" class="w-full rounded-2xl border border-slate-300 p-2.5" />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Age *</label>
                  <input required id="intake-age" type="number" placeholder="28" class="w-full rounded-2xl border border-slate-300 p-2.5" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Gender</label>
                  <select id="intake-gender" class="w-full rounded-2xl border border-slate-300 p-2.5">
                    <option>Female</option>
                    <option>Male</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Phone</label>
                <input id="intake-phone" type="tel" placeholder="0803..." class="w-full rounded-2xl border border-slate-300 p-2.5" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Known Allergies</label>
                <input id="intake-allergies" type="text" placeholder="None Known (or e.g. Penicillin)" class="w-full rounded-2xl border border-slate-300 p-2.5" />
              </div>
              <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
                <input id="intake-bp" type="text" placeholder="BP (120/80)" class="rounded-xl border border-slate-300 p-2 text-[11px]" />
                <input id="intake-temp" type="text" placeholder="Temp (37.0°C)" class="rounded-xl border border-slate-300 p-2 text-[11px]" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Chief Complaint *</label>
                <textarea required id="intake-complaint" rows="2" placeholder="Symptoms..." class="w-full rounded-2xl border border-slate-300 p-2.5"></textarea>
              </div>
              <button type="submit" class="w-full py-3 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-bold transition">
                + Register &amp; Queue for Doctor
              </button>
            </form>
          </div>

          <!-- Website Bookings -->
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 lg:col-span-2">
            <h3 class="font-bold text-slate-900 text-base mb-1">Website Appointments (${db.appointments.length})</h3>
            <p class="text-xs text-slate-500 mb-4">Bookings received from the public website.</p>

            <div class="space-y-3">
              ${db.appointments.map(a => `
                <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-between text-xs">
                  <div>
                    <span class="font-bold text-slate-900 text-sm">${esc(a.name)}</span>
                    <p class="text-slate-500 mt-0.5">${esc(a.department)} &bull; Date: ${esc(a.date)} &bull; Tel: ${esc(a.phone)}</p>
                    ${a.notes ? `<p class="text-slate-600 mt-1 italic">"${esc(a.notes)}"</p>` : ''}
                  </div>
                  ${a.status !== 'Checked In' ? `
                    <button onclick="checkInAppointment('${a.id}')" class="px-3.5 py-2 rounded-xl bg-brand-700 text-white font-bold text-xs hover:bg-brand-800">
                      Check In
                    </button>
                  ` : '<span class="text-emerald-700 font-bold">Checked In ✓</span>'}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function handleRegister(e) {
      e.preventDefault();
      const newId = 'RSS-' + (1001 + db.patients.length);
      const name = document.getElementById('intake-name').value.trim();
      const age = document.getElementById('intake-age').value;
      const gender = document.getElementById('intake-gender').value;
      const phone = document.getElementById('intake-phone').value.trim();
      const allergies = document.getElementById('intake-allergies').value.trim() || 'None Known';
      const bp = document.getElementById('intake-bp').value.trim() || '120/80';
      const temp = document.getElementById('intake-temp').value.trim() || '36.8°C';
      const complaint = document.getElementById('intake-complaint').value.trim();

      const pt = {
        id: newId,
        name, age, gender, phone, allergies,
        vitals: { bp, temp, pulse: '76 bpm', weight: '70 kg' },
        complaint,
        status: 'Awaiting Consultation',
        registeredAt: fullStamp()
      };

      db.patients.unshift(pt);
      db.activePatientId = newId;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('POST', '/api/patients', pt);
      setTab('consultation');
      showToast(`${name} queued for doctor.`);
    }

    function checkInAppointment(aptId) {
      const apt = db.appointments.find(a => a.id === aptId);
      if (!apt) return;
      apt.status = 'Checked In';
      const newId = 'RSS-' + (1001 + db.patients.length);
      const pt = {
        id: newId,
        name: apt.name,
        age: 30,
        gender: 'Female',
        phone: apt.phone,
        allergies: 'None Known',
        vitals: { bp: '120/80', temp: '36.8°C', pulse: '76 bpm', weight: '65 kg' },
        complaint: apt.notes || apt.department,
        status: 'Awaiting Consultation',
        registeredAt: fullStamp(),
        appointmentId: apt.id
      };
      db.patients.unshift(pt);
      db.activePatientId = newId;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('POST', '/api/patients', pt);
      setTab('consultation');
      showToast(`${apt.name} checked in & queued for Doctor.`);
    }

    function dischargeBed(wardKey, idx) {
      if (!canRole(['doctor', 'nurse'])) return alert('Access restricted: Only Doctors or Nurses can discharge beds.');
      const bed = db.wards[wardKey].beds[idx];
      const pt = getPatient(bed.patientId);
      const prevDx = bed.diagnosis;
      if (!confirm('Discharge patient from this bed?')) return;
      if (pt) pt.status = 'Discharged';
      bed.patientId = null;
      bed.diagnosis = '';
      bed.admittedAt = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('PATCH', '/api/wards', { action: 'discharge', wardKey, bedIdx: idx });
      renderCurrentTab();
      showToast('Patient discharged.');
      if (pt) printDischargeSlip(pt, db.wards[wardKey].label, prevDx);
    }

    function openAdmitModal(wardKey, bedIdx) {
      const ward = db.wards[wardKey];
      const bed = ward.beds[bedIdx];
      const opts = db.patients.map(p => `<option value="${p.id}">${esc(p.id)} - ${esc(p.name)}</option>`).join('');

      openModal(`Admit to ${ward.label} (Bed ${bed.bedNo})`, `
        <form onsubmit="handleAdmitSubmit(event, '${wardKey}', ${bedIdx})" class="space-y-4 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Select Patient</label>
            <select id="modal-admit-pt" class="w-full rounded-2xl border border-slate-300 p-2.5">${opts}</select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Admission Diagnosis *</label>
            <input required id="modal-admit-dx" type="text" placeholder="e.g. Acute Malaria / Observation" class="w-full rounded-2xl border border-slate-300 p-2.5" />
          </div>
          <button type="submit" class="w-full py-3 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-bold">
            Confirm Bed Admission
          </button>
        </form>
      `);
    }

    function handleAdmitSubmit(e, wardKey, bedIdx) {
      e.preventDefault();
      const ptId = document.getElementById('modal-admit-pt').value;
      const dx = document.getElementById('modal-admit-dx').value.trim();
      const bed = db.wards[wardKey].beds[bedIdx];
      const pt = getPatient(ptId);
      const stamp = fullStamp();

      bed.patientId = ptId;
      bed.diagnosis = dx;
      bed.admittedAt = stamp;
      if (pt) pt.status = 'Admitted';

      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateTopBadges();
      apiMutate('PATCH', '/api/wards', { action: 'admit', wardKey, bedIdx, patientId: ptId, diagnosis: dx, admittedAt: stamp });
      closeModal();
      renderCurrentTab();
      showToast(`Admitted to Bed ${bed.bedNo}`);
    }

    // =========================================================
    // MASTER CHART MODAL
    // =========================================================
    function openPatientChart(patientId) {
      const pt = getPatient(patientId);
      if (!pt) return;
      const labs = db.labs.filter(l => l.patientId === patientId);
      const rxs = db.prescriptions.filter(r => r.patientId === patientId);
      const consults = db.consultations.filter(c => c.patientId === patientId);

      openModal(`Medical Folder: ${pt.name} (${pt.id})`, `
        <div class="space-y-4 text-xs">
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 grid grid-cols-2 gap-3">
            <div><span class="text-slate-400 block text-[10px] uppercase">Age / Gender</span><strong>${esc(pt.age)} / ${esc(pt.gender)}</strong></div>
            <div><span class="text-slate-400 block text-[10px] uppercase">Phone</span><strong>${esc(pt.phone || '—')}</strong></div>
            <div class="col-span-2"><span class="text-slate-400 block text-[10px] uppercase">Allergies</span><strong class="${pt.allergies && pt.allergies !== 'None Known' ? 'text-rose-700' : 'text-slate-800'}">${esc(pt.allergies || 'None Known')}</strong></div>
            <div class="col-span-2"><span class="text-slate-400 block text-[10px] uppercase">Vitals</span><strong>BP ${esc(pt.vitals.bp || '--')}, Temp ${esc(pt.vitals.temp || '--')}, Pulse ${esc(pt.vitals.pulse || '--')}, Wt ${esc(pt.vitals.weight || '--')}</strong></div>
          </div>

          <div>
            <h4 class="font-bold text-slate-900 mb-2 uppercase tracking-wider text-[11px]">Doctor's Encounters (${consults.length})</h4>
            ${consults.length === 0 ? '<p class="text-slate-400">No previous consults.</p>' : consults.map(c => `
              <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 mb-2">
                <div class="flex justify-between font-bold text-slate-800 border-b border-slate-200 pb-1 mb-1">
                  <span>${esc(c.doctorName)}</span>
                  <span class="font-normal text-slate-400">${esc(c.date)}</span>
                </div>
                <p class="text-brand-800 font-bold">Dx: ${esc(c.diagnosis)}</p>
                <p class="text-slate-600 mt-1">${esc(c.notes)}</p>
              </div>
            `).join('')}
          </div>

          <div>
            <h4 class="font-bold text-slate-900 mb-2 uppercase tracking-wider text-[11px]">Laboratory Results (${labs.length})</h4>
            ${labs.length === 0 ? '<p class="text-slate-400">No lab tests.</p>' : labs.map(l => `
              <div class="p-2.5 rounded-xl border border-slate-200 mb-1 flex justify-between">
                <span><strong>${esc(l.testName)}</strong>: ${esc(l.result || 'Pending')}</span>
                <span class="text-slate-400">${esc(l.status)}</span>
              </div>
            `).join('')}
          </div>

          <div>
            <h4 class="font-bold text-slate-900 mb-2 uppercase tracking-wider text-[11px]">Prescriptions (${rxs.length})</h4>
            ${rxs.length === 0 ? '<p class="text-slate-400">No prescriptions.</p>' : rxs.map(r => `
              <div class="p-2.5 rounded-xl border border-slate-200 mb-1 flex justify-between">
                <span><strong>${esc(r.medication)}</strong> &bull; ${esc(r.dosage)}</span>
                <span class="text-slate-400">${esc(r.status)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    function openModal(title, html) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    // =========================================================
    // PRINTABLE CLINICAL SLIPS (Lab, Rx, Discharge)
    // =========================================================
    function openPrintModal(docTitle, bodyHtml) {
      openModal(docTitle, `
        <div class="space-y-4 text-xs">
          <div class="border-b border-slate-200 pb-3">
            <h4 class="font-black text-slate-900 text-base">Richard Smile Salem Medical Center</h4>
            <p class="text-slate-500">No. 15 Shalom, Jenta Mangoro, Jos, Plateau State &bull; Tel: +234 803 000 0000</p>
            <p class="text-[11px] text-slate-400 mt-1">Printed: ${fullStamp()}</p>
          </div>
          ${bodyHtml}
          <div class="pt-6 border-t border-slate-200 flex items-center justify-between">
            <div>
              <p class="text-slate-400">Authorized Signature / Stamp</p>
              <p class="font-bold text-slate-800 mt-4">____________________________</p>
            </div>
            <button onclick="window.print()" class="no-print px-5 py-2.5 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-bold text-xs shadow">
              🖨️ Print Slip
            </button>
          </div>
        </div>
      `);
    }

    function printLabSlip(labId) {
      const l = db.labs.find(x => x.id === labId);
      if (!l) return;
      const pt = getPatient(l.patientId) || { name: l.patientId, id: l.patientId, age: '--', gender: '--' };
      openPrintModal(`Laboratory Report (${l.id})`, `
        <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
          <p><strong>Patient:</strong> ${esc(pt.name)} (${esc(pt.id)}) &bull; ${esc(pt.age)} yrs / ${esc(pt.gender)}</p>
          <p><strong>Investigation:</strong> ${esc(l.testName)}</p>
          <p><strong>Ordered By:</strong> ${esc(l.orderedBy || 'Clinician')}</p>
        </div>
        <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
          <p class="text-[11px] uppercase font-bold text-emerald-800">Verified Laboratory Result</p>
          <p class="text-sm font-bold text-slate-900 mt-1">${esc(l.result || 'Pending')}</p>
          <p class="text-[11px] text-slate-500 mt-1">Verified By: ${esc(l.verifiedBy || 'MLS')}</p>
        </div>
      `);
    }

    function printRxSlip(rxId) {
      const r = db.prescriptions.find(x => x.id === rxId);
      if (!r) return;
      const pt = getPatient(r.patientId) || { name: r.patientId, id: r.patientId, age: '--', gender: '--' };
      openPrintModal(`Pharmacy Prescription (${r.id})`, `
        <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
          <p><strong>Patient:</strong> ${esc(pt.name)} (${esc(pt.id)}) &bull; ${esc(pt.age)} yrs / ${esc(pt.gender)}</p>
          <p><strong>Allergies:</strong> ${esc(pt.allergies || 'None Known')}</p>
        </div>
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-200 space-y-1">
          <p class="text-[11px] uppercase font-bold text-indigo-800">Prescribed Medication</p>
          <p class="text-sm font-bold text-slate-900">${esc(r.medication)}</p>
          <p class="text-slate-700 font-semibold">${esc(r.dosage)}</p>
          <p class="text-[11px] text-slate-500 pt-1">Prescribed By: ${esc(r.prescribedBy || 'Clinician')} &bull; Status: ${esc(r.status)}</p>
        </div>
      `);
    }

    function printDischargeSlip(pt, wardLabel, diagnosis) {
      openPrintModal(`Inpatient Discharge Summary (${pt.id})`, `
        <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
          <p><strong>Patient:</strong> ${esc(pt.name)} (${esc(pt.id)}) &bull; ${esc(pt.age)} yrs / ${esc(pt.gender)}</p>
          <p><strong>Discharged From:</strong> ${esc(wardLabel)}</p>
          <p><strong>Diagnosis:</strong> ${esc(diagnosis || 'Recovered')}</p>
          <p><strong>Discharging Officer:</strong> ${esc(db.currentUser ? db.currentUser.name : 'Clinician')}</p>
        </div>
      `);
    }

    // =========================================================
    // AUTH LOGIC (Real PIN Verification + Role Landing)
    // =========================================================
    function prefillStaffName() {
      const role = document.getElementById('login-role').value;
      const cfg = STAFF_PINS[role];
      if (cfg) {
        document.getElementById('login-name').value = cfg.defaultName;
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const role = document.getElementById('login-role').value;
      const name = document.getElementById('login-name').value.trim();
      const pin = document.getElementById('login-pin').value.trim();
      const expected = STAFF_PINS[role] ? STAFF_PINS[role].pin : '1234';

      if (pin !== expected) {
        return alert(`Invalid PIN for ${role.toUpperCase()} role. (Demo PIN is ${expected})`);
      }

      db.currentUser = { name, role };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      setTab(STAFF_PINS[role].defaultTab || 'consultation');
      checkAuth();
      showToast(`Welcome, ${name}`);
    }

    function checkAuth() {
      const loginView = document.getElementById('login-view');
      const emrView = document.getElementById('emr-view');

      if (!db.currentUser) {
        loginView.classList.remove('hidden');
        emrView.classList.add('hidden');
      } else {
        loginView.classList.add('hidden');
        emrView.classList.remove('hidden');
        document.getElementById('staff-name-display').textContent = db.currentUser.name;
        document.getElementById('staff-role-badge').textContent = db.currentUser.role.toUpperCase();
        renderCurrentTab();
      }
    }

    function quickLogin(name, role) {
      db.currentUser = { name, role };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      setTab((STAFF_PINS[role] && STAFF_PINS[role].defaultTab) || 'consultation');
      checkAuth();
      showToast(`Welcome, ${name}`);
    }

    function handleLogout() {
      if (!confirm('Sign out?')) return;
      db.currentUser = null;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      checkAuth();
    }

    // Initialize
    checkAuth();
    syncFromServer(true);
    setInterval(() => syncFromServer(false), 4000);
  </script>
</body>
</html>
